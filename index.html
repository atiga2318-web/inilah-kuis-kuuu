    <script>
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playCorrect() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            },
            playWrong() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);

                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            },
            playClick() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        };

        const quizData = [

            },

                question: "Jaringan perangkat fisik seperti lampu pintar dan thermostat yang saling terhubung ke internet dinamakan...",
                options: ["Internet of Things (IoT)", "Cloud Mesh", "Smart Grid System", "Cyber-Physical Link"],
                answer: 0,
                explanation: "IoT (Internet of Things) adalah konsep terhubungnya objek fisik ke internet untuk pertukaran data secara cerdas."

            },
            {
                question: "Sensor berbasis sinar laser yang digunakan mobil otonom (tanpa pengemudi) untuk mengukur jarak sekitar adalah...",
                options: ["LiDAR", "Radar Sonar", "Infrared Grid", "GPS Tracker"],

            },
            {
                question: "Metode latihan AI di mana model diberi masukan data beserta kunci jawaban (label) yang benar dinamakan...",
                options: ["Supervised Learning", "Unsupervised Learning", "Reinforcement Learning", "Zero-Shot Learning"],
                answer: 0,
                explanation: "Supervised Learning (Pembelajaran Terawasi) menggunakan kumpulan data terlabel agar AI belajar mengenali pola yang tepat."
            },
            {
                question: "Sistem keamanan biometrik modern yang memanfaatkan AI untuk memverifikasi struktur wajah penggunanya dinamakan...",

        ];

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = []; 
        let isAnswered = false;
        let shuffledQuestions = [];

        function prepareQuestions() {
            shuffledQuestions = quizData.map((q, idx) => {
                const optionsWithOrig = q.options.map((opt, i) => ({
                    text: opt,
                    isCorrect: i === q.answer
                }));
                
                for (let i = optionsWithOrig.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithOrig[i], optionsWithOrig[j]] = [optionsWithOrig[j], optionsWithOrig[i]];
                }

                return {
                    question: q.question,
                    options: optionsWithOrig,
                    explanation: q.explanation,
                    originalIndex: idx
                };
            });
        }

        const appEl = document.getElementById('app');

        function renderWelcome() {
            appEl.innerHTML = `
                <div class="flex flex-col md:flex-row items-center gap-8 md:gap-12">

                        <div class="w-32 h-32 md:w-48 md:h-48 bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 rounded-[2.5rem] flex items-center justify-center shadow-2xl transform -rotate-6 transition-transform hover:rotate-0 duration-500">

                        </div>
                    </div>
                    
                    <!-- Kanan: Teks & Tombol -->
                    <div class="w-full md:w-2/3 text-center md:text-left">
                        <h2 class="text-3xl md:text-4xl font-black text-slate-800 mb-4">Siap Uji Wawasanmu?</h2>
                        <p class="text-slate-600 text-base md:text-lg mb-8 leading-relaxed">
                            Buktikan seberapa jauh kamu mengenal dunia Kecerdasan Buatan, inovasi digital, dan teknologi masa depan yang mengubah dunia saat ini!
                        </p>

                            <div class="bg-purple-100 p-4 rounded-2xl md:rounded-3xl border border-purple-200">
                                <span class="block text-purple-700 font-extrabold text-2xl md:text-3xl">15</span>
                                <span class="text-xs md:text-sm text-purple-600 font-bold uppercase mt-1">Soal Kuis</span>
                            </div>
                            <div class="bg-pink-100 p-4 rounded-2xl md:rounded-3xl border border-pink-200">
                                <span class="block text-pink-700 font-extrabold text-2xl md:text-3xl">Fun</span>
                                <span class="text-xs md:text-sm text-pink-600 font-bold uppercase mt-1">Tampilan</span>
                            </div>
                            <div class="bg-indigo-100 p-4 rounded-2xl md:rounded-3xl border border-indigo-200">
                                <span class="block text-indigo-700 font-extrabold text-2xl md:text-3xl">SFX</span>

                            </div>
                        </div>

                            <i data-lucide="rocket" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();

            document.getElementById('start-btn').addEventListener('click', () => {
                AudioFX.playClick();
                prepareQuestions();
                currentQuestion = 0;
                score = 0;
                userAnswers = [];
                renderQuiz();
            });
        }

        function renderQuiz() {
            isAnswered = false;
            const q = shuffledQuestions[currentQuestion];
            const progress = ((currentQuestion + 1) / shuffledQuestions.length) * 100;

            appEl.innerHTML = `
                <!-- Progress Header -->
                <div class="mb-6 md:mb-8">
                    <div class="flex justify-between items-center text-sm md:text-base font-bold text-slate-500 mb-3">
                        <span class="flex items-center gap-2 text-purple-600 bg-purple-50 px-3 py-1.5 rounded-lg border border-purple-100">
                            <i data-lucide="help-circle" class="w-5 h-5"></i>
                            Pertanyaan ${currentQuestion + 1} / 15
                        </span>
                        <span class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-3 py-1.5 rounded-lg shadow-sm">
                            ${Math.round(progress)}% Selesai
                        </span>
                    </div>
                    <div class="w-full h-4 md:h-5 bg-slate-100 rounded-full overflow-hidden p-1 border border-slate-200 shadow-inner">
                        <div class="h-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 rounded-full transition-all duration-700 ease-out relative" style="width: ${progress}%">
                            <div class="absolute inset-0 bg-white/20 w-full h-full animate-[pulse_2s_ease-in-out_infinite]"></div>
                        </div>
                    </div>
                </div>

                <!-- Pertanyaan -->
                <div class="mb-8 md:mb-10 text-center md:text-left">
                    <h3 class="text-xl md:text-3xl font-extrabold text-slate-800 leading-tight">
                        ${q.question}
                    </h3>
                </div>

                <!-- Grid Pilihan Jawaban (Menjadi 2 Kolom di Layar Lebar) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-5 mb-8" id="options-container">
                    ${q.options.map((opt, idx) => `
                        <button data-index="${idx}" class="option-btn h-full w-full option-card bg-slate-50 hover:bg-purple-50 border-2 border-slate-200 hover:border-purple-300 p-4 md:p-6 rounded-2xl font-bold text-slate-700 text-left flex items-center justify-between group shadow-sm">
                            <span class="text-base md:text-lg pr-4">${opt.text}</span>
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white border-2 border-slate-300 flex items-center justify-center shrink-0 group-hover:border-purple-500 group-hover:bg-purple-100 transition-colors">
                                <span class="text-sm md:text-base text-slate-400 group-hover:text-purple-600 font-black">${String.fromCharCode(65 + idx)}</span>
                            </div>
                        </button>
                    `).join('')}
                </div>

                <!-- Box Penjelasan -->
                <div id="explanation-box" class="hidden mb-8 p-5 md:p-6 rounded-2xl md:rounded-3xl bg-amber-50 border-2 border-amber-200 text-sm md:text-base text-amber-900 leading-relaxed shadow-inner">
                    <div class="font-black mb-2 flex items-center gap-2 text-amber-700 text-base md:text-lg">
                        <i data-lucide="lightbulb" class="w-5 h-5 md:w-6 md:h-6"></i> Fakta Menarik:
                    </div>
                    <span id="explanation-text" class="block font-medium">${q.explanation}</span>
                </div>

                <!-- Tombol Lanjut -->
                <div class="flex justify-end">
                    <button id="next-btn" class="hidden w-full md:w-auto btn-gradient text-white font-extrabold py-4 px-8 rounded-2xl md:rounded-3xl shadow-lg flex items-center justify-center gap-3 text-lg transition-all">
                        <span>${currentQuestion < shuffledQuestions.length - 1 ? 'LANJUT SOAL BERIKUTNYA' : 'LIHAT HASIL AKHIR'}</span>
                        <i data-lucide="${currentQuestion < shuffledQuestions.length - 1 ? 'arrow-right' : 'flag'}" class="w-6 h-6"></i>
                    </button>
                </div>
            `;
            lucide.createIcons();

            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (isAnswered) return;
                    isAnswered = true;

                    const selectedIdx = parseInt(btn.getAttribute('data-index'));
                    const isCorrect = q.options[selectedIdx].isCorrect;

                    userAnswers.push({
                        question: q.question,
                        selectedText: q.options[selectedIdx].text,
                        correctText: q.options.find(o => o.isCorrect).text,
                        isCorrect: isCorrect,
                        explanation: q.explanation
                    });

                    // Styling UI based on correct/incorrect
                    optionBtns.forEach((b, i) => {
                        b.disabled = true;
                        b.classList.remove('hover:bg-purple-50', 'hover:border-purple-300');
                        b.classList.add('cursor-not-allowed');
                        
                        if (q.options[i].isCorrect) {
                            b.classList.remove('bg-slate-50', 'border-slate-200');
                            b.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'shadow-md');

                            b.querySelector('div').innerHTML = '<i data-lucide="check" class="w-5 h-5"></i>';
                        } else if (i === selectedIdx && !isCorrect) {
                            b.classList.remove('bg-slate-50', 'border-slate-200');
                            b.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-900', 'shadow-md');
                            b.querySelector('div').className = 'w-8 h-8 md:w-10 md:h-10 rounded-full bg-rose-500 text-white flex items-center justify-center shrink-0 font-bold text-base shadow-sm';
                            b.querySelector('div').innerHTML = '<i data-lucide="x" class="w-5 h-5"></i>';
                        } else {
                            b.classList.add('opacity-40', 'scale-95');
                        }
                    });

                    lucide.createIcons(); // Re-render check/x icons

                    if (isCorrect) {
                        score++;
                        AudioFX.playCorrect();
                    } else {
                        AudioFX.playWrong();
                    }

                    document.getElementById('explanation-box').classList.remove('hidden');
                    document.getElementById('explanation-box').classList.add('animate-[fadeIn_0.5s_ease-out]');
                    
                    const nextBtn = document.getElementById('next-btn');
                    nextBtn.classList.remove('hidden');
                    nextBtn.classList.add('animate-[bounce-short_1s_ease-in-out_infinite]');
                    
                    setTimeout(() => {
                        nextBtn.scrollIntoView({ behavior: 'smooth', block: 'end' });
                    }, 100);
                });
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                AudioFX.playClick();
                if (currentQuestion < shuffledQuestions.length - 1) {
                    currentQuestion++;
                    renderQuiz();
                } else {
                    renderResult();
                }
            });

        function renderResult() {
            const percentage = Math.round((score / shuffledQuestions.length) * 100);
            
            if (percentage >= 60) {
                const duration = 3000;
                const end = Date.now() + duration;
                (function frame() {
                    confetti({
                        particleCount: 5,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 },
                        colors: ['#ec4899', '#8b5cf6', '#3b82f6']
                    });
                    confetti({
                        particleCount: 5,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 },
                        colors: ['#ec4899', '#8b5cf6', '#3b82f6']
                    });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }

            let badgeTitle = "";
            let badgeClass = "";
            let iconStr = "";
            if (percentage === 100) {
                badgeTitle = "God Tier: AI Mastermind";
                badgeClass = "bg-amber-100 text-amber-800 border-amber-300";
                iconStr = "crown";
            } else if (percentage >= 75) {
                badgeTitle = "Pro: Tech Expert";
                badgeClass = "bg-purple-100 text-purple-800 border-purple-300";
                iconStr = "zap";
